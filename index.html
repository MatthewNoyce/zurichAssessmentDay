<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for proper text display -->
    <meta charset="UTF-8">
    <!-- Viewport settings for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container for the form -->
    <div class="container">
        <h1>Life Insurance Application</h1>
        <p>Please enter your personal details below:</p>
        
        <!-- Life insurance application form -->
        <form id="userForm">
            <!-- Full name input field -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            
            <!-- Date of birth input field -->
            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>
            
            <!-- Address textarea field -->
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" required></textarea>
            </div>
            
            <!-- Gender dropdown selection -->
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Please select...</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
            </div>
            
            <!-- Occupation input field -->
            <div class="form-group">
                <label for="occupation">Occupation</label>
                <input type="text" id="occupation" name="occupation" required>
            </div>
            
            <!-- Annual income input field (numeric) -->
            <div class="form-group">
                <label for="income">Annual Income (£)</label>
                <input type="number" id="income" name="income" min="0" step="1000" required>
            </div>
            
            <!-- Marital status dropdown selection -->
            <div class="form-group">
                <label for="maritalStatus">Marital Status</label>
                <select id="maritalStatus" name="maritalStatus" required>
                    <option value="">Please select...</option>
                    <option value="single">Single</option>
                    <option value="married">Married</option>
                    <option value="civil-partnership">Civil Partnership</option>
                    <option value="divorced">Divorced</option>
                    <option value="widowed">Widowed</option>
                </select>
            </div>
            
            <!-- Number of dependants input field (numeric) -->
            <div class="form-group">
                <label for="dependants">Number of Dependants</label>
                <input type="number" id="dependants" name="dependants" min="0" required>
            </div>
            
            <!-- Submit button -->
            <button type="submit">Submit</button>
        </form>
        
        <!-- Container for success/error messages -->
        <div id="message"></div>
    </div>
    
    <script>
        // Add event listener for form submission
        document.getElementById('userForm').addEventListener('submit', function(e) {
            // Prevent default form submission behaviour (page reload)
            e.preventDefault();
            
            // Collect all form data into a JavaScript object
            const formData = {
                fullName: document.getElementById('fullName').value,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                address: document.getElementById('address').value,
                gender: document.getElementById('gender').value,
                occupation: document.getElementById('occupation').value,
                income: document.getElementById('income').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                dependants: document.getElementById('dependants').value,
                submittedAt: new Date().toISOString() // Add timestamp of submission
            };
            
            // Convert the form data object to a JSON string with formatting
            const jsonData = JSON.stringify(formData, null, 2);
            
            // Create a Blob object containing the JSON data
            const blob = new Blob([jsonData], { type: 'application/json' });
            // Create a temporary URL for the blob
            const url = URL.createObjectURL(blob);
            // Create a temporary anchor element for downloading
            const a = document.createElement('a');
            a.href = url;
            a.download = 'life_insurance_application.json'; // Set the download filename
            document.body.appendChild(a);
            a.click(); // Trigger the download
            document.body.removeChild(a); // Clean up the anchor element
            URL.revokeObjectURL(url); // Release the blob URL
            
            // Display success message to the user
            const messageDiv = document.getElementById('message');
            // Insert success message HTML with submitted data
            messageDiv.innerHTML = `
                <div class="success">
                    <p><strong>Thank you for submitting your information!</strong></p>
                    <p>Your application data has been saved to a JSON file.</p>
                    <p><strong>Name:</strong> ${formData.fullName}</p>
                    <p><strong>Date of Birth:</strong> ${formData.dateOfBirth}</p>
                    <p><strong>Occupation:</strong> ${formData.occupation}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
