<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for proper text display -->
    <meta charset="UTF-8">
    <!-- Viewport settings for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container for the form -->
    <div class="container">
        <h1>Life Insurance Application</h1>
        <p>Please enter your personal details below:</p>
        
        <!-- Life insurance application form -->
        <form id="userForm">
            <!-- Full name input field -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            
            <!-- Date of birth input field -->
            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>
            
            <!-- Address textarea field -->
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" required></textarea>
            </div>
            
            <!-- Gender dropdown selection -->
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Please select...</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
            </div>
            
            <!-- Occupation input field -->
            <div class="form-group">
                <label for="occupation">Occupation</label>
                <input type="text" id="occupation" name="occupation" required>
            </div>
            
            <!-- Annual income input field (numeric) -->
            <div class="form-group">
                <label for="income">Annual Income (£)</label>
                <input type="number" id="income" name="income" min="0" step="1000" required>
            </div>
            
            <!-- Marital status dropdown selection -->
            <div class="form-group">
                <label for="maritalStatus">Marital Status</label>
                <select id="maritalStatus" name="maritalStatus" required>
                    <option value="">Please select...</option>
                    <option value="single">Single</option>
                    <option value="married">Married</option>
                    <option value="civil-partnership">Civil Partnership</option>
                    <option value="divorced">Divorced</option>
                    <option value="widowed">Widowed</option>
                </select>
            </div>
            
            <!-- Number of dependants input field (numeric) -->
            <div class="form-group">
                <label for="dependants">Number of Dependants</label>
                <input type="number" id="dependants" name="dependants" min="0" required>
            </div>
            
            <!-- Submit button -->
            <button type="submit">Next: Health & Medical History</button>
        </form>
        
        <!-- Container for success/error messages -->
        <div id="message"></div>
    </div>
    
    <script>
        // Add event listener for form submission
        document.getElementById('userForm').addEventListener('submit', async function(e) {
            // Prevent default form submission behaviour (page reload)
            e.preventDefault();
            
            // Collect all form data into a JavaScript object
            const formData = {
                fullName: document.getElementById('fullName').value,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                address: document.getElementById('address').value,
                gender: document.getElementById('gender').value,
                occupation: document.getElementById('occupation').value,
                income: document.getElementById('income').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                dependants: document.getElementById('dependants').value,
                submittedAt: new Date().toISOString() // Add timestamp of submission
            };
            
            const messageDiv = document.getElementById('message');
            
            try {
                // Send form data to the Flask backend server
                const response = await fetch('http://localhost:5000/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                // Parse the JSON response from the server
                const result = await response.json();
                
                if (result.status === 'success') {
                    // Redirect to health history page
                    window.location.href = 'health.html';
                } else {
                    // Display error message if server returned an error
                    messageDiv.innerHTML = `
                        <div class="error">
                            <p><strong>Error:</strong> ${result.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                // Display error message if the request failed
                messageDiv.innerHTML = `
                    <div class="error">
                        <p><strong>Error:</strong> Could not connect to server. Please make sure the Flask server is running.</p>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
