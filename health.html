<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for proper text display -->
    <meta charset="UTF-8">
    <!-- Viewport settings for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health and Medical History</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Progress bar -->
    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" style="width: 50%;">50%</div>
        </div>
        <div class="progress-text">Step 2 of 4: Health and Medical History</div>
    </div>
    
    <!-- Main container for the form -->
    <div class="container">
        <h1>Health and Medical History</h1>
        <p>Please provide your health and medical information:</p>
        
        <!-- Health and medical history form -->
        <form id="healthForm">
            <!-- Height input field -->
            <div class="form-group">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" name="height" min="0" step="0.1" required>
            </div>
            
            <!-- Weight input field -->
            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" name="weight" min="0" step="0.1" required>
            </div>
            
            <!-- BMI display (calculated automatically) -->
            <div class="form-group">
                <label>BMI (Body Mass Index)</label>
                <input type="text" id="bmi" name="bmi" readonly>
            </div>
            
            <!-- Current medications textarea -->
            <div class="form-group">
                <label for="medications">Current Medications</label>
                <textarea id="medications" name="medications" rows="3" placeholder="List all current medications, or write 'None'"></textarea>
            </div>
            
            <!-- Pre-existing medical conditions -->
            <div class="form-group">
                <label for="medicalConditions">Pre-existing Medical Conditions</label>
                <textarea id="medicalConditions" name="medicalConditions" rows="3" placeholder="e.g., diabetes, heart disease, cancer, etc., or write 'None'" required></textarea>
            </div>
            
            <!-- Previous surgeries or hospitalisations -->
            <div class="form-group">
                <label for="surgeries">Previous Surgeries or Hospitalisations</label>
                <textarea id="surgeries" name="surgeries" rows="3" placeholder="List any previous surgeries or hospital stays, or write 'None'" required></textarea>
            </div>
            
            <!-- Family medical history -->
            <div class="form-group">
                <label for="familyHistory">Family Medical History</label>
                <textarea id="familyHistory" name="familyHistory" rows="3" placeholder="Particularly heart disease, cancer, stroke, or write 'None'" required></textarea>
            </div>
            
            <!-- Mental health history -->
            <div class="form-group">
                <label for="mentalHealth">Mental Health History</label>
                <textarea id="mentalHealth" name="mentalHealth" rows="3" placeholder="e.g., depression, anxiety, or write 'None'" required></textarea>
            </div>
            
            <!-- Blood pressure -->
            <div class="form-group">
                <label for="bloodPressure">Blood Pressure (e.g., 120/80)</label>
                <input type="text" id="bloodPressure" name="bloodPressure" placeholder="e.g., 120/80" required>
            </div>
            
            <!-- Cholesterol levels -->
            <div class="form-group">
                <label for="cholesterol">Cholesterol Level (mmol/L)</label>
                <input type="number" id="cholesterol" name="cholesterol" min="0" step="0.1" placeholder="e.g., 5.2">
            </div>
            
            <!-- Submit button -->
            <button type="submit">Next: Lifestyle and Driving History</button>
        </form>
        
        <!-- Container for success/error messages -->
        <div id="message"></div>
    </div>
    
    <script>
        // Calculate BMI automatically when height or weight changes
        const heightInput = document.getElementById('height');
        const weightInput = document.getElementById('weight');
        const bmiInput = document.getElementById('bmi');
        
        function calculateBMI() {
            const height = parseFloat(heightInput.value);
            const weight = parseFloat(weightInput.value);
            
            if (height > 0 && weight > 0) {
                // BMI = weight (kg) / (height (m))^2
                const heightInMeters = height / 100;
                const bmi = weight / (heightInMeters * heightInMeters);
                bmiInput.value = bmi.toFixed(1);
            } else {
                bmiInput.value = '';
            }
        }
        
        // Validation functions
        function validateHeight(height) {
            // Height should be between 100cm and 250cm
            return height >= 100 && height <= 250;
        }
        
        function validateWeight(weight) {
            // Weight should be between 30kg and 300kg
            return weight >= 30 && weight <= 300;
        }
        
        function validateBloodPressure(bp) {
            // Format: systolic/diastolic (e.g., 120/80)
            const bpPattern = /^\d{2,3}\/\d{2,3}$/;
            if (!bpPattern.test(bp)) return false;
            
            const [systolic, diastolic] = bp.split('/').map(Number);
            // Systolic: 70-250, Diastolic: 40-150
            return systolic >= 70 && systolic <= 250 && diastolic >= 40 && diastolic <= 150;
        }
        
        function validateCholesterol(cholesterol) {
            // Cholesterol should be between 2.0 and 15.0 mmol/L
            return cholesterol >= 2.0 && cholesterol <= 15.0;
        }
        
        heightInput.addEventListener('input', calculateBMI);
        weightInput.addEventListener('input', calculateBMI);
        
        // Add real-time validation
        heightInput.addEventListener('blur', function() {
            const height = parseFloat(this.value);
            if (!validateHeight(height)) {
                this.style.borderColor = '#dc3545';
                if (!document.getElementById('heightError')) {
                    const error = document.createElement('small');
                    error.id = 'heightError';
                    error.style.color = '#dc3545';
                    error.textContent = 'Height must be between 100cm and 250cm';
                    this.parentElement.appendChild(error);
                }
            } else {
                this.style.borderColor = '#28a745';
                const error = document.getElementById('heightError');
                if (error) error.remove();
            }
        });
        
        weightInput.addEventListener('blur', function() {
            const weight = parseFloat(this.value);
            if (!validateWeight(weight)) {
                this.style.borderColor = '#dc3545';
                if (!document.getElementById('weightError')) {
                    const error = document.createElement('small');
                    error.id = 'weightError';
                    error.style.color = '#dc3545';
                    error.textContent = 'Weight must be between 30kg and 300kg';
                    this.parentElement.appendChild(error);
                }
            } else {
                this.style.borderColor = '#28a745';
                const error = document.getElementById('weightError');
                if (error) error.remove();
            }
        });
        
        document.getElementById('bloodPressure').addEventListener('blur', function() {
            const bp = this.value;
            if (!validateBloodPressure(bp)) {
                this.style.borderColor = '#dc3545';
                if (!document.getElementById('bpError')) {
                    const error = document.createElement('small');
                    error.id = 'bpError';
                    error.style.color = '#dc3545';
                    error.textContent = 'Please enter blood pressure in format: 120/80';
                    this.parentElement.appendChild(error);
                }
            } else {
                this.style.borderColor = '#28a745';
                const error = document.getElementById('bpError');
                if (error) error.remove();
            }
        });
        
        document.getElementById('cholesterol').addEventListener('blur', function() {
            const cholesterol = parseFloat(this.value);
            if (this.value && !validateCholesterol(cholesterol)) {
                this.style.borderColor = '#dc3545';
                if (!document.getElementById('cholesterolError')) {
                    const error = document.createElement('small');
                    error.id = 'cholesterolError';
                    error.style.color = '#dc3545';
                    error.textContent = 'Cholesterol must be between 2.0 and 15.0 mmol/L';
                    this.parentElement.appendChild(error);
                }
            } else {
                this.style.borderColor = '#28a745';
                const error = document.getElementById('cholesterolError');
                if (error) error.remove();
            }
        });
        
        // Add event listener for form submission
        document.getElementById('healthForm').addEventListener('submit', async function(e) {
            // Prevent default form submission behaviour (page reload)
            e.preventDefault();
            
            // Get form values
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const bloodPressure = document.getElementById('bloodPressure').value;
            const cholesterol = parseFloat(document.getElementById('cholesterol').value);
            
            // Validate all fields
            const heightValid = validateHeight(height);
            const weightValid = validateWeight(weight);
            const bpValid = validateBloodPressure(bloodPressure);
            const cholesterolValid = !cholesterol || validateCholesterol(cholesterol);
            
            // Show error message if validation fails
            if (!heightValid || !weightValid || !bpValid || !cholesterolValid) {
                const messageDiv = document.getElementById('message');
                messageDiv.innerHTML = `
                    <div class="error">
                        <p><strong>Please correct the following errors:</strong></p>
                        ${!heightValid ? '<p>• Height must be between 100cm and 250cm</p>' : ''}
                        ${!weightValid ? '<p>• Weight must be between 30kg and 300kg</p>' : ''}
                        ${!bpValid ? '<p>• Blood pressure must be in format: 120/80</p>' : ''}
                        ${!cholesterolValid ? '<p>• Cholesterol must be between 2.0 and 15.0 mmol/L</p>' : ''}
                    </div>
                `;
                messageDiv.scrollIntoView({ behavior: 'smooth' });
                return;
            }
            
            // Collect all health form data into a JavaScript object
            const healthData = {
                height: height,
                weight: weight,
                bmi: document.getElementById('bmi').value,
                medications: document.getElementById('medications').value,
                medicalConditions: document.getElementById('medicalConditions').value,
                surgeries: document.getElementById('surgeries').value,
                familyHistory: document.getElementById('familyHistory').value,
                mentalHealth: document.getElementById('mentalHealth').value,
                bloodPressure: bloodPressure,
                cholesterol: cholesterol || '',
                submittedAt: new Date().toISOString() // Add timestamp of submission
            };
            
            // Save health data to localStorage
            localStorage.setItem('healthInfo', JSON.stringify(healthData));
            
            // Redirect to lifestyle page
            window.location.href = 'lifestyle.html';
        });
    </script>
</body>
</html>
